name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install Poetry
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        run: poetry install --extras managed-client

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Generate fallback Towncrier fragment for dependency bot PRs
        if: >
          github.event_name == 'pull_request' &&
          (
            github.event.pull_request.user.login == 'renovate' ||
            github.event.pull_request.user.login == 'renovate[bot]' ||
            github.event.pull_request.user.login == 'dependabot[bot]'
          )
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if git diff --name-only origin/${BASE_REF}...HEAD -- newsfragments | grep -q '^newsfragments/'; then
            echo "Newsfragment already present on PR branch."
            exit 0
          fi

          branch_topic="${HEAD_REF#*/}"
          poetry run python scripts/write_renovate_towncrier_fragment.py --pr-title "$PR_TITLE" "$branch_topic"

      - name: Require Towncrier news fragment
        if: ${{ github.event_name == 'pull_request' }}
        run: poetry run towncrier check --compare-with origin/${{ github.base_ref }}

      - name: Lint with ni-python-styleguide
        run: poetry run ni-python-styleguide lint

      - name: Lint with black
        run: poetry run black --check .

      - name: Run tests
        run: poetry run pytest

      - name: Smoke test generated webapp build
        run: poetry run python scripts/smoke_test_webapp.py

      - name: Build PyInstaller binary
        run: poetry run python scripts/build_pyinstaller.py

      - name: Smoke test managed-client binary
        run: dist/slcli/slcli managed-client smoke

      - name: Upload PyInstaller binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slcli-binary
          path: dist/slcli/

  migration-full-os-matrix-e2e:
    name: E2E (Migration - full OS matrix) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install Poetry
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        run: poetry install

      - name: Run migration full OS matrix E2E tests
        run: poetry run pytest tests/e2e/ -m "e2e_migration and full_os_client_matrix" --timeout=300 --no-cov

  managed-client-macos:
    name: Managed-client crypto (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install Poetry
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        run: poetry install --extras managed-client

      - name: Install OpenSSL provider
        run: brew install openssl@3

      - name: Test managed-client crypto and authentication
        run: poetry run pytest tests/unit/test_managed_client_crypto.py tests/unit/test_managed_client_transport.py tests/unit/test_managed_client.py --no-cov -q

  native-credentials:
    name: Native credentials (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      SLCLI_E2E_NATIVE_CREDENTIALS: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install Poetry
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        run: poetry install

      - name: Test managed-client state ACLs on Windows
        if: runner.os == 'Windows'
        run: poetry run pytest tests/unit/test_managed_client_state.py --no-cov -q

      - name: Install Linux credential service
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y gnome-keyring dbus

      - name: Test native Linux credentials
        if: runner.os == 'Linux'
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.SecretService.Keyring
        run: |
          dbus-run-session -- bash -euo pipefail <<'BASH'
          poetry run python -c 'import secrets; print(secrets.token_urlsafe(32))' | gnome-keyring-daemon --unlock --components=secrets
          poetry run pytest tests/e2e/test_credentials_e2e.py -k test_native_secure_read_logout --timeout=120 --no-cov -q
          BASH

      - name: Test native macOS and Windows credentials
        if: runner.os != 'Linux'
        run: poetry run pytest tests/e2e/test_credentials_e2e.py -k test_native_secure_read_logout --timeout=120 --no-cov -q

  e2e-sls:
    name: E2E (SLS)
    runs-on: ubuntu-latest
    needs: build-test-lint
    timeout-minutes: 45
    env:
      SLCLI_E2E_SLS_BASE_URL: ${{ vars.SLCLI_E2E_SLS_BASE_URL }}
    steps:
      - name: Check SLS E2E configuration
        id: sls-config
        env:
          SLCLI_E2E_SLS_API_KEY: ${{ secrets.SLCLI_E2E_SLS_API_KEY }}
        run: |
          if [ -n "$SLCLI_E2E_SLS_API_KEY" ]; then
            if [ -z "$SLCLI_E2E_SLS_BASE_URL" ]; then
              echo "::error::Set the SLCLI_E2E_SLS_BASE_URL repository variable."
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SLS E2E job because SLCLI_E2E_SLS_API_KEY is not configured."
          fi

      - name: Checkout code
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install Poetry
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        run: poetry install

      - name: Write SLS E2E config
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        env:
          SLCLI_E2E_SLS_API_KEY: ${{ secrets.SLCLI_E2E_SLS_API_KEY }}
          SLCLI_E2E_SLS_WORKSPACE: ${{ vars.SLCLI_E2E_SLS_WORKSPACE }}
          SLCLI_E2E_SLS_TEST_NOTEBOOK_PATH: ${{ vars.SLCLI_E2E_SLS_TEST_NOTEBOOK_PATH }}
          SLCLI_E2E_TIMEOUT: ${{ vars.SLCLI_E2E_TIMEOUT }}
          SLCLI_E2E_CLEANUP: ${{ vars.SLCLI_E2E_CLEANUP }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "sls": {
                  "base_url": os.environ["SLCLI_E2E_SLS_BASE_URL"],
                  "api_key": os.environ["SLCLI_E2E_SLS_API_KEY"],
                  "workspace": os.environ.get("SLCLI_E2E_SLS_WORKSPACE") or "SLCLI-Test",
                  "platform": "SLS",
              },
              "timeout": int(os.environ.get("SLCLI_E2E_TIMEOUT") or "60"),
              "cleanup": (os.environ.get("SLCLI_E2E_CLEANUP") or "true").lower() == "true",
          }

          test_notebook_path = os.environ.get("SLCLI_E2E_SLS_TEST_NOTEBOOK_PATH")
          if test_notebook_path:
              config["sls"]["test_notebook_path"] = test_notebook_path

          Path("tests/e2e/e2e_config.json").write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run SLS E2E tests
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        run: poetry run pytest tests/e2e/ -m "e2e and not sle" --e2e-platform sls -n auto --timeout=300

  e2e-migration:
    name: E2E (Migration)
    runs-on: ubuntu-latest
    needs: build-test-lint
    timeout-minutes: 45
    # The source (SLS) is replayed from committed tapes; the destination (SLE) is live.
    # Runs share fixture workspaces on the destination, so overlapping cleanup would race.
    concurrency:
      group: e2e-migration-sle
      cancel-in-progress: false
    env:
      SLCLI_E2E_SOURCE_MODE: replay
      SLCLI_E2E_DESTINATION_MODE: live
      SLCLI_E2E_DESTINATION_PROFILE: migration-destination
      SLCLI_E2E_SLE_BASE_URL: https://test-api.lifecyclesolutions.ni.com
      SLCLI_E2E_SLE_WEB_URL: https://test.lifecyclesolutions.ni.com
      SLCLI_TEST_PREFECT_API_URL: http://127.0.0.1:4200/api
    steps:
      - name: Check migration E2E configuration
        id: migration-config
        env:
          SLCLI_E2E_SLE_API_KEY: ${{ secrets.SLCLI_E2E_SLE_API_KEY }}
        run: |
          if [ -n "$SLCLI_E2E_SLE_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping migration E2E job because SLCLI_E2E_SLE_API_KEY is not configured."
          fi

      - name: Checkout code
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install Poetry
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        run: poetry install

      # Started early so its startup overlaps profile setup; shared by all migration tests.
      - name: Start Prefect server
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        env:
          PREFECT_HOME: ${{ runner.temp }}/prefect
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
          PREFECT_UI_ENABLED: "false"
        run: |
          nohup poetry run prefect server start --host 127.0.0.1 --port 4200 \
            > "$RUNNER_TEMP/prefect-server.log" 2>&1 &

      - name: Configure migration destination profile
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        env:
          SLCLI_E2E_SLE_API_KEY: ${{ secrets.SLCLI_E2E_SLE_API_KEY }}
        # Answer the optional default-workspace prompt with an empty line.
        run: >-
          echo "" | poetry run slcli config add
          --profile "$SLCLI_E2E_DESTINATION_PROFILE"
          --url "$SLCLI_E2E_SLE_BASE_URL"
          --web-url "$SLCLI_E2E_SLE_WEB_URL"
          --api-key "$SLCLI_E2E_SLE_API_KEY"
          --no-set-current

      - name: Wait for Prefect server
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        run: |
          for _ in $(seq 60); do
            curl -sf "$SLCLI_TEST_PREFECT_API_URL/health" && exit 0
            sleep 1
          done
          exit 1

      - name: Run migration E2E tests
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        run: poetry run pytest tests/e2e/ -m "e2e_migration and not full_os_client_matrix" --timeout=300 --no-cov

      - name: Upload Prefect server log
        if: ${{ always() && steps.migration-config.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-prefect-server-log
          path: ${{ runner.temp }}/prefect-server.log
          if-no-files-found: ignore

  e2e-migration-sls-container:
    name: E2E (Migration - SLS container)
    # sls-test is tested on this label: GitHub-hosted Linux with nested KVM.
    runs-on: ubuntu-26.04
    needs: build-test-lint
    timeout-minutes: 100
    # The source (SLS) is a fresh container of the published base image, seeded by the tests.
    # The destination (SLE) is live and shared with the replay job, so runs are serialized.
    concurrency:
      group: e2e-migration-sle
      cancel-in-progress: false
    env:
      SLS_IMAGE: ghcr.io/ni-kismet/sls-server:26.5
      SLCLI_E2E_SOURCE_MODE: live
      SLCLI_E2E_SOURCE_PROFILE: migration-source
      SLCLI_E2E_DESTINATION_MODE: live
      SLCLI_E2E_DESTINATION_PROFILE: migration-destination
      SLCLI_E2E_SLE_BASE_URL: https://test-api.lifecyclesolutions.ni.com
      SLCLI_E2E_SLE_WEB_URL: https://test.lifecyclesolutions.ni.com
      SLCLI_TEST_PREFECT_API_URL: http://127.0.0.1:4200/api
    steps:
      - name: Check migration E2E configuration
        id: migration-config
        env:
          SLCLI_E2E_SLE_API_KEY: ${{ secrets.SLCLI_E2E_SLE_API_KEY }}
        run: |
          if [ -n "$SLCLI_E2E_SLE_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping migration E2E job because SLCLI_E2E_SLE_API_KEY is not configured."
          fi

      - name: Checkout code
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exports SLS_BASE_URL and SLS_CONTAINER; the web admin is admin/test.
      - name: Start SystemLink Server
        id: sls
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        uses: ni-kismet/sls-test/sls-start-server@739fceea1b722b5a9f5b3de9cd753697f3fb1d62 # main
        with:
          image: ${{ env.SLS_IMAGE }}

      - name: Set up Python
        id: setup-python
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install Poetry
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        run: poetry install

      - name: Start Prefect server
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        env:
          PREFECT_HOME: ${{ runner.temp }}/prefect
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
          PREFECT_UI_ENABLED: "false"
        run: |
          nohup poetry run prefect server start --host 127.0.0.1 --port 4200 \
            > "$RUNNER_TEMP/prefect-server.log" 2>&1 &

      - name: Prepare SystemLink Server source
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        run: poetry run python -m tests.e2e.sls_container

      - name: Configure migration destination profile
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        env:
          SLCLI_E2E_SLE_API_KEY: ${{ secrets.SLCLI_E2E_SLE_API_KEY }}
        # Answer the optional default-workspace prompt with an empty line.
        run: >-
          echo "" | poetry run slcli config add
          --profile "$SLCLI_E2E_DESTINATION_PROFILE"
          --url "$SLCLI_E2E_SLE_BASE_URL"
          --web-url "$SLCLI_E2E_SLE_WEB_URL"
          --api-key "$SLCLI_E2E_SLE_API_KEY"
          --no-set-current

      - name: Wait for Prefect server
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        run: |
          for _ in $(seq 60); do
            curl -sf "$SLCLI_TEST_PREFECT_API_URL/health" && exit 0
            sleep 1
          done
          exit 1

      - name: Run migration E2E tests
        id: tests
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        continue-on-error: true
        run: poetry run pytest tests/e2e/ -m "e2e_migration and not full_os_client_matrix" --timeout=300 --no-cov

      # TEMPORARY (draft PR): find which side resets the SLS -> SLE file transfer.
      - name: Diagnose file transfer
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        continue-on-error: true
        shell: poetry run python {0}
        run: |
          import json, sys, traceback, uuid
          sys.path.insert(0, ".")
          from slcli.migration.connection import resolve_migration_connection
          from slcli.migration.files.client import FileContent, FilesClient
          from tests.e2e.migration_endpoints import get_or_create_workspace
          from tests.e2e.owned_resource_helpers import MIGRATION_DISCOVERY_OWNER, owner_properties
          from tests.e2e.workspaces import E2EWorkspace

          src = resolve_migration_connection("migration-source")
          dst = resolve_migration_connection("migration-destination")
          props = owner_properties(MIGRATION_DISCOVERY_OWNER)
          payload = b"slcli e2e file transfer diagnostic\n" * 4
          src_ws = get_or_create_workspace(src, E2EWorkspace.FILES_SOURCE)
          dst_ws = get_or_create_workspace(dst, E2EWorkspace.DESTINATION)

          def files_url(c):
              return f"{c.base_url}/nifile/v1/service-groups/Default"

          def delete(c, file_id):
              with c.create_session() as s:
                  r = s.delete(f"{files_url(c)}/files/{file_id}", timeout=60)
                  print(f"  delete {file_id}: {r.status_code}")

          def attempt(label, action):
              print(f"== {label}", flush=True)
              try:
                  result = action()
                  print(f"  ok: {result}", flush=True)
                  return result
              except Exception:
                  traceback.print_exc()
                  return None

          def seed():
              with src.create_session() as s:
                  r = s.post(f"{files_url(src)}/upload-files", params={"workspace": src_ws},
                             data={"metadata": json.dumps(props)},
                             files={"file": ("diag.txt", payload)}, timeout=60)
                  print(f"  {r.status_code} {r.text[:300]}")
                  r.raise_for_status()
                  return r.json()["uri"].rstrip("/").rsplit("/", 1)[-1]

          def raw_download(file_id):
              with src.create_session() as s:
                  r = s.get(f"{files_url(src)}/files/{file_id}/data",
                            headers={"Accept-Encoding": "identity"}, stream=True, timeout=60)
                  print(f"  {r.status_code} headers={dict(r.headers)}")
                  return len(b"".join(r.iter_content(65536)))

          def client_download(file_id):
              with FilesClient(src).download_file(file_id) as content:
                  return content.length, len(b"".join(content.chunks))

          def upload(content):
              file_id = uuid.uuid4().hex[:24]
              actual = FilesClient(dst).upload_file(file_id, dst_ws, "diag.txt", props, content)
              delete(dst, actual)
              return actual

          def streamed_copy(file_id):
              with FilesClient(src).download_file(file_id) as content:
                  print(f"  source length={content.length}")
                  return upload(content)

          src_id = attempt("seed source file", seed)
          if src_id:
              attempt("raw source download", lambda: raw_download(src_id))
              attempt("FilesClient source download", lambda: client_download(src_id))
          attempt("SLE upload, sized body",
                  lambda: upload(FileContent(chunks=[payload], length=len(payload))))
          attempt("SLE upload, chunked body",
                  lambda: upload(FileContent(chunks=iter([payload]), length=None)))
          if src_id:
              attempt("streamed SLS -> SLE copy", lambda: streamed_copy(src_id))
              delete(src, src_id)

      # The Windows guest occasionally bugchecks on nested KVM. sls-test recommends a fresh
      # container and one rerun when the container is no longer healthy after the tests.
      - name: Check for a SystemLink Server crash
        id: crash
        if: ${{ steps.tests.outcome == 'failure' }}
        run: |
          health=$(docker inspect -f '{{.State.Health.Status}}' "$SLS_CONTAINER" 2>/dev/null || echo missing)
          if [ "$health" = healthy ]; then
            exit 0
          fi
          echo "crashed=true" >> "$GITHUB_OUTPUT"
          {
            echo "SystemLink Server container was $health after the tests (host CPU: $HOST_CPU)."
            docker logs "$SLS_CONTAINER" 2>&1 | grep -i 'bugcheck' || true
            echo "Rerunning the failed tests once on a fresh container."
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          HOST_CPU: ${{ steps.sls.outputs.host-cpu }}

      - name: Collect crashed SystemLink Server logs
        if: ${{ steps.crash.outputs.crashed == 'true' }}
        uses: ni-kismet/sls-test/sls-collect-logs@739fceea1b722b5a9f5b3de9cd753697f3fb1d62 # main
        with:
          artifact: migration-sls-container-crash-logs
          container: sls

      - name: Restart SystemLink Server
        if: ${{ steps.crash.outputs.crashed == 'true' }}
        uses: ni-kismet/sls-test/sls-start-server@739fceea1b722b5a9f5b3de9cd753697f3fb1d62 # main
        with:
          image: ${{ env.SLS_IMAGE }}
          replace: 'true'
          host-prep: 'false'

      - name: Prepare restarted SystemLink Server source
        if: ${{ steps.crash.outputs.crashed == 'true' }}
        run: poetry run python -m tests.e2e.sls_container

      - name: Rerun failed migration E2E tests
        if: ${{ steps.crash.outputs.crashed == 'true' }}
        run: poetry run pytest tests/e2e/ -m "e2e_migration and not full_os_client_matrix" --last-failed --timeout=300 --no-cov

      - name: Fail on migration E2E test failures
        if: ${{ steps.tests.outcome == 'failure' && steps.crash.outputs.crashed != 'true' }}
        run: exit 1

      - name: Collect SystemLink Server logs
        if: ${{ failure() && steps.migration-config.outputs.enabled == 'true' }}
        uses: ni-kismet/sls-test/sls-collect-logs@739fceea1b722b5a9f5b3de9cd753697f3fb1d62 # main
        with:
          artifact: migration-sls-container-logs
          container: sls
          path: ${{ runner.temp }}/prefect-server.log

  e2e-sle:
    name: E2E (SLE)
    runs-on: ubuntu-latest
    needs: build-test-lint
    timeout-minutes: 45
    env:
      SLCLI_E2E_SLE_BASE_URL: https://test-api.lifecyclesolutions.ni.com
    steps:
      - name: Check SLE E2E configuration
        id: sle-config
        env:
          SLCLI_E2E_SLE_API_KEY: ${{ secrets.SLCLI_E2E_SLE_API_KEY }}
        run: |
          if [ -n "$SLCLI_E2E_SLE_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SLE E2E job because SLCLI_E2E_SLE_API_KEY is not configured."
          fi

      - name: Checkout code
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install Poetry
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        run: poetry install

      - name: Write SLE E2E config
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        env:
          SLCLI_E2E_SLE_API_KEY: ${{ secrets.SLCLI_E2E_SLE_API_KEY }}
          SLCLI_E2E_SLE_WORKSPACE: ${{ vars.SLCLI_E2E_SLE_WORKSPACE }}
          SLCLI_E2E_SLE_TEST_NOTEBOOK_ID: ${{ vars.SLCLI_E2E_SLE_TEST_NOTEBOOK_ID }}
          SLCLI_E2E_TIMEOUT: ${{ vars.SLCLI_E2E_TIMEOUT }}
          SLCLI_E2E_CLEANUP: ${{ vars.SLCLI_E2E_CLEANUP }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "sle": {
                  "base_url": os.environ["SLCLI_E2E_SLE_BASE_URL"],
                  "api_key": os.environ["SLCLI_E2E_SLE_API_KEY"],
                  "workspace": os.environ.get("SLCLI_E2E_SLE_WORKSPACE") or "Default",
                  "platform": "SLE",
              },
              "timeout": int(os.environ.get("SLCLI_E2E_TIMEOUT") or "60"),
              "cleanup": (os.environ.get("SLCLI_E2E_CLEANUP") or "true").lower() == "true",
          }

          test_notebook_id = os.environ.get("SLCLI_E2E_SLE_TEST_NOTEBOOK_ID")
          if test_notebook_id:
              config["sle"]["test_notebook_id"] = test_notebook_id

          Path("tests/e2e/e2e_config.json").write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run SLE E2E tests
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        run: poetry run pytest tests/e2e/ -m "e2e and not sls" --e2e-platform sle -n auto --timeout=300