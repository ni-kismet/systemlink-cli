name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: ni/python-actions/setup-poetry@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        run: poetry install --extras managed-client

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Generate fallback Towncrier fragment for dependency bot PRs
        if: >
          github.event_name == 'pull_request' &&
          (
            github.event.pull_request.user.login == 'renovate' ||
            github.event.pull_request.user.login == 'renovate[bot]' ||
            github.event.pull_request.user.login == 'dependabot[bot]'
          )
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if git diff --name-only origin/${BASE_REF}...HEAD -- newsfragments | grep -q '^newsfragments/'; then
            echo "Newsfragment already present on PR branch."
            exit 0
          fi

          branch_topic="${HEAD_REF#*/}"
          poetry run python scripts/write_renovate_towncrier_fragment.py --pr-title "$PR_TITLE" "$branch_topic"

      - name: Require Towncrier news fragment
        if: ${{ github.event_name == 'pull_request' }}
        run: poetry run towncrier check --compare-with origin/${{ github.base_ref }}

      - name: Lint with ni-python-styleguide
        run: poetry run ni-python-styleguide lint

      - name: Lint with black
        run: poetry run black --check .

      - name: Run tests
        run: poetry run pytest

      - name: Smoke test generated webapp build
        run: poetry run python scripts/smoke_test_webapp.py

      - name: Build PyInstaller binary
        run: poetry run python scripts/build_pyinstaller.py

      - name: Smoke test managed-client binary
        run: dist/slcli/slcli managed-client smoke

      - name: Upload PyInstaller binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slcli-binary
          path: dist/slcli/

  migration-full-os-matrix-e2e:
    name: E2E (Migration - full OS matrix) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: ni/python-actions/setup-poetry@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        run: poetry install

      - name: Run migration full OS matrix E2E tests
        run: poetry run pytest tests/e2e/ -m "e2e_migration and full_os_client_matrix" --timeout=300 --no-cov

  managed-client-macos:
    name: Managed-client crypto (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: ni/python-actions/setup-poetry@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        run: poetry install --extras managed-client

      - name: Install OpenSSL provider
        run: brew install openssl@3

      - name: Test managed-client crypto and authentication
        run: poetry run pytest tests/unit/test_managed_client_crypto.py tests/unit/test_managed_client_transport.py tests/unit/test_managed_client.py --no-cov -q

  native-credentials:
    name: Native credentials (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      SLCLI_E2E_NATIVE_CREDENTIALS: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: ni/python-actions/setup-poetry@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        run: poetry install

      - name: Test managed-client state ACLs on Windows
        if: runner.os == 'Windows'
        run: poetry run pytest tests/unit/test_managed_client_state.py --no-cov -q

      - name: Install Linux credential service
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y gnome-keyring dbus

      - name: Test native Linux credentials
        if: runner.os == 'Linux'
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.SecretService.Keyring
        run: |
          dbus-run-session -- bash -euo pipefail <<'BASH'
          poetry run python -c 'import secrets; print(secrets.token_urlsafe(32))' | gnome-keyring-daemon --unlock --components=secrets
          poetry run pytest tests/e2e/test_credentials_e2e.py -k test_native_secure_read_logout --timeout=120 --no-cov -q
          BASH

      - name: Test native macOS and Windows credentials
        if: runner.os != 'Linux'
        run: poetry run pytest tests/e2e/test_credentials_e2e.py -k test_native_secure_read_logout --timeout=120 --no-cov -q

  e2e-sls:
    name: E2E (SLS)
    runs-on: ubuntu-latest
    needs: build-test-lint
    timeout-minutes: 45
    env:
      SLCLI_E2E_SLS_BASE_URL: https://base.systemlink.io
    steps:
      - name: Check SLS E2E configuration
        id: sls-config
        env:
          SLCLI_E2E_SLS_API_KEY: ${{ secrets.SLCLI_E2E_SLS_API_KEY }}
        run: |
          if [ -n "$SLCLI_E2E_SLS_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SLS E2E job because SLCLI_E2E_SLS_API_KEY is not configured."
          fi

      - name: Checkout code
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        uses: ni/python-actions/setup-poetry@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        run: poetry install

      - name: Write SLS E2E config
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        env:
          SLCLI_E2E_SLS_API_KEY: ${{ secrets.SLCLI_E2E_SLS_API_KEY }}
          SLCLI_E2E_SLS_WORKSPACE: ${{ vars.SLCLI_E2E_SLS_WORKSPACE }}
          SLCLI_E2E_SLS_TEST_NOTEBOOK_PATH: ${{ vars.SLCLI_E2E_SLS_TEST_NOTEBOOK_PATH }}
          SLCLI_E2E_TIMEOUT: ${{ vars.SLCLI_E2E_TIMEOUT }}
          SLCLI_E2E_CLEANUP: ${{ vars.SLCLI_E2E_CLEANUP }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "sls": {
                  "base_url": os.environ["SLCLI_E2E_SLS_BASE_URL"],
                  "api_key": os.environ["SLCLI_E2E_SLS_API_KEY"],
                  "workspace": os.environ.get("SLCLI_E2E_SLS_WORKSPACE") or "Default",
                  "platform": "SLS",
              },
              "timeout": int(os.environ.get("SLCLI_E2E_TIMEOUT") or "60"),
              "cleanup": (os.environ.get("SLCLI_E2E_CLEANUP") or "true").lower() == "true",
          }

          test_notebook_path = os.environ.get("SLCLI_E2E_SLS_TEST_NOTEBOOK_PATH")
          if test_notebook_path:
              config["sls"]["test_notebook_path"] = test_notebook_path

          Path("tests/e2e/e2e_config.json").write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run SLS E2E tests
        if: ${{ steps.sls-config.outputs.enabled == 'true' }}
        run: poetry run pytest tests/e2e/ -m "e2e and not sle" --e2e-platform sls -n auto --timeout=300

  e2e-migration:
    name: E2E (Migration)
    runs-on: ubuntu-latest
    needs: build-test-lint
    timeout-minutes: 45
    # Runs share fixture workspaces on one server, so overlapping cleanup would race.
    concurrency:
      group: e2e-migration-sls
      cancel-in-progress: false
    env:
      SLCLI_E2E_SLS_BASE_URL: https://base.systemlink.io
      SLCLI_E2E_SOURCE_PROFILE: migration-source
      SLCLI_TEST_PREFECT_API_URL: http://127.0.0.1:4200/api
    steps:
      - name: Check migration E2E configuration
        id: migration-config
        env:
          SLCLI_E2E_SLS_API_KEY: ${{ secrets.SLCLI_E2E_SLS_API_KEY }}
        run: |
          if [ -n "$SLCLI_E2E_SLS_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping migration E2E job because SLCLI_E2E_SLS_API_KEY is not configured."
          fi

      - name: Checkout code
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        uses: ni/python-actions/setup-poetry@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0

      - name: Install dependencies
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        run: poetry install

      # Started early so its startup overlaps profile setup; shared by all migration tests.
      - name: Start Prefect server
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        env:
          PREFECT_HOME: ${{ runner.temp }}/prefect
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
          PREFECT_UI_ENABLED: "false"
        run: |
          nohup poetry run prefect server start --host 127.0.0.1 --port 4200 \
            > "$RUNNER_TEMP/prefect-server.log" 2>&1 &

      - name: Configure migration profiles
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        env:
          SLCLI_E2E_SLS_API_KEY: ${{ secrets.SLCLI_E2E_SLS_API_KEY }}
        run: >-
          poetry run slcli config add
          --profile "$SLCLI_E2E_SOURCE_PROFILE"
          --url "$SLCLI_E2E_SLS_BASE_URL"
          --web-url "$SLCLI_E2E_SLS_BASE_URL"
          --api-key "$SLCLI_E2E_SLS_API_KEY"
          --no-set-current

      - name: Wait for Prefect server
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        run: |
          for _ in $(seq 60); do
            curl -sf "$SLCLI_TEST_PREFECT_API_URL/health" && exit 0
            sleep 1
          done
          exit 1

      - name: Run migration E2E tests
        if: ${{ steps.migration-config.outputs.enabled == 'true' }}
        run: poetry run pytest tests/e2e/ -m "e2e_migration and not full_os_client_matrix" --timeout=300 --no-cov

      - name: Upload Prefect server log
        if: ${{ always() && steps.migration-config.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-prefect-server-log
          path: ${{ runner.temp }}/prefect-server.log
          if-no-files-found: ignore

  e2e-sle:
    name: E2E (SLE)
    runs-on: ubuntu-latest
    needs: build-test-lint
    timeout-minutes: 45
    env:
      SLCLI_E2E_SLE_BASE_URL: https://test-api.lifecyclesolutions.ni.com
    steps:
      - name: Check SLE E2E configuration
        id: sle-config
        env:
          SLCLI_E2E_SLE_API_KEY: ${{ secrets.SLCLI_E2E_SLE_API_KEY }}
        run: |
          if [ -n "$SLCLI_E2E_SLE_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SLE E2E job because SLCLI_E2E_SLE_API_KEY is not configured."
          fi

      - name: Checkout code
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        uses: ni/python-actions/setup-poetry@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0
        env:
          pythonVersion: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        run: poetry install

      - name: Write SLE E2E config
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        env:
          SLCLI_E2E_SLE_API_KEY: ${{ secrets.SLCLI_E2E_SLE_API_KEY }}
          SLCLI_E2E_SLE_WORKSPACE: ${{ vars.SLCLI_E2E_SLE_WORKSPACE }}
          SLCLI_E2E_SLE_TEST_NOTEBOOK_ID: ${{ vars.SLCLI_E2E_SLE_TEST_NOTEBOOK_ID }}
          SLCLI_E2E_TIMEOUT: ${{ vars.SLCLI_E2E_TIMEOUT }}
          SLCLI_E2E_CLEANUP: ${{ vars.SLCLI_E2E_CLEANUP }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "sle": {
                  "base_url": os.environ["SLCLI_E2E_SLE_BASE_URL"],
                  "api_key": os.environ["SLCLI_E2E_SLE_API_KEY"],
                  "workspace": os.environ.get("SLCLI_E2E_SLE_WORKSPACE") or "Default",
                  "platform": "SLE",
              },
              "timeout": int(os.environ.get("SLCLI_E2E_TIMEOUT") or "60"),
              "cleanup": (os.environ.get("SLCLI_E2E_CLEANUP") or "true").lower() == "true",
          }

          test_notebook_id = os.environ.get("SLCLI_E2E_SLE_TEST_NOTEBOOK_ID")
          if test_notebook_id:
              config["sle"]["test_notebook_id"] = test_notebook_id

          Path("tests/e2e/e2e_config.json").write_text(
              json.dumps(config, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run SLE E2E tests
        if: ${{ steps.sle-config.outputs.enabled == 'true' }}
        run: poetry run pytest tests/e2e/ -m "e2e and not sls" --e2e-platform sle -n auto --timeout=300