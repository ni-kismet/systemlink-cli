name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: slcli-linux
          - os: macos-latest
            platform: macos
            artifact_name: slcli-macos
          - os: macos-15-intel
            platform: macos
            artifact_name: slcli-macos-15-intel
          - os: windows-latest
            platform: windows
            artifact_name: slcli-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the specific tag if triggered by workflow_dispatch
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: poetry run pytest

      - name: Build PyInstaller binary
        run: poetry run build-pyinstaller

      - name: Create platform-specific tarball (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar -czf "${{ matrix.artifact_name }}.tar.gz" slcli/

      - name: Create platform-specific tarball (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd dist
          tar -czf "${{ matrix.artifact_name }}.tar.gz" slcli/

      - name: Create Windows ZIP for Scoop
        if: matrix.platform == 'windows'
        run: |
          cd dist
          Compress-Archive -Path slcli -DestinationPath slcli.zip

      - name: Upload platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name == 'slcli-windows' && 'slcli.zip' || format('{0}.tar.gz', matrix.artifact_name) }}

  homebrew-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slcli-linux
          path: dist/

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slcli-macos
          path: dist/

      - name: Download macOS 13 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slcli-macos-15-intel
          path: dist/

      - name: Build Homebrew formula
        run: poetry run python scripts/build_homebrew.py

      - name: Upload Homebrew artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-artifacts
          path: |
            dist/homebrew-slcli.rb

  scoop-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slcli-windows
          path: dist/

      - name: Build Scoop manifest
        run: poetry run python scripts/build_scoop.py

      - name: Upload Scoop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scoop-artifacts
          path: |
            dist/scoop-slcli.json

  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Generate CycloneDX SBOM
        run: poetry run cyclonedx-py poetry --no-dev --output-format JSON -o sbom.cdx.json

      - name: Enrich SBOM metadata
        run: poetry run python scripts/enrich_sbom.py sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  release:
    needs: [build, homebrew-build, scoop-build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            homebrew-artifacts/homebrew-slcli.rb
            scoop-artifacts/scoop-slcli.json
            slcli-linux/slcli-linux.tar.gz
            slcli-macos/slcli-macos.tar.gz
            slcli-macos-15-intel/slcli-macos-15-intel.tar.gz
            slcli-windows/slcli.zip
            sbom/sbom.cdx.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ni-kismet/homebrew-ni
          token: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
          path: homebrew-ni

      - name: Download Homebrew formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-artifacts
          path: formula/

      - name: Update formula in tap
        run: |
          cp formula/homebrew-slcli.rb homebrew-ni/Formula/slcli.rb
          cd homebrew-ni
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/slcli.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date."
            exit 0
          fi
          git commit -m "slcli ${{ github.event.inputs.tag || github.ref_name }}: update to latest release with multi-platform support"
          git push

  update-scoop-bucket:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scoop bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ni-kismet/scoop-ni
          token: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
          path: scoop-ni

      - name: Download Scoop manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scoop-artifacts
          path: manifest/

      - name: Update manifest in bucket
        run: |
          cp manifest/scoop-slcli.json scoop-ni/bucket/slcli.json
          cd scoop-ni
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/slcli.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already up to date."
            exit 0
          fi
          git commit -m "slcli ${{ github.event.inputs.tag || github.ref_name }}: update to latest release"
          git push

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pip install poetry

      - name: Build package
        run: poetry build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
