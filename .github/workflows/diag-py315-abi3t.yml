name: DIAG py315 abi3t (scratch, do not merge)

on:
  push:
    branches: [users/astarche/diag-py315-abi3t]

permissions:
  contents: read

jobs:
  poetry-repro:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9692cdea67295d65a129fb661da3b8cb1c79bf82  # PR #284 head
          persist-credentials: false
      - uses: ni/python-actions/setup-python@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        with:
          python-version: '3.15'
      - uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
      - name: poetry install
        run: poetry install --extras managed-client --no-interaction
      - name: Inspect env and _rust.pyd
        shell: pwsh
        continue-on-error: true
        run: |
          $envPath = poetry env info -p
          "env=$envPath"
          Get-Content "$envPath\pyvenv.cfg"
          "--- dlls in env root/Scripts ---"
          Get-ChildItem $envPath, "$envPath\Scripts" -Filter '*.dll' | Select-Object FullName
          Get-ChildItem $envPath -Recurse -Directory -Filter '*abi3t*' | Select-Object FullName
          $site = "$envPath\Lib\site-packages"
          Get-ChildItem $site -Directory -Filter 'cryptography*' | Select-Object Name
          Get-Content (Get-ChildItem $site -Directory -Filter 'cryptography-*.dist-info' | Select-Object -First 1 | ForEach-Object { "$($_.FullName)\WHEEL" })
          $pyd = "$site\cryptography\hazmat\bindings\_rust.pyd"
          Get-Item $pyd | Select-Object FullName, Length, LastWriteTime
          (Get-FileHash $pyd).Hash
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          "dumpbin=$dumpbin"
          & $dumpbin /dependents $pyd
      - name: Import in poetry env
        continue-on-error: true
        run: poetry run python -c "import cryptography.hazmat.bindings._rust as r; print('POETRY IMPORT OK', r.__file__)"
      - name: Exact failing CI command
        continue-on-error: true
        env:
          SLCLI_E2E_NATIVE_CREDENTIALS: 1
        run: poetry run pytest tests/unit/test_managed_client_state.py --no-cov -q
      - name: Compare with pip-installed wheel in a fresh venv
        shell: pwsh
        continue-on-error: true
        run: |
          python -m venv "$env:RUNNER_TEMP\v"
          & "$env:RUNNER_TEMP\v\Scripts\python.exe" -m pip install -q --only-binary=:all: cryptography==50.0.2
          $pyd = "$env:RUNNER_TEMP\v\Lib\site-packages\cryptography\hazmat\bindings\_rust.pyd"
          Get-Item $pyd | Select-Object Length
          (Get-FileHash $pyd).Hash
          & "$env:RUNNER_TEMP\v\Scripts\python.exe" -c "import cryptography.hazmat.bindings._rust as r; print('PIP VENV IMPORT OK')"
      - name: Poetry lock entries for cryptography 50.0.2 Windows
        shell: pwsh
        run: Select-String -Path poetry.lock -Pattern 'cryptography-50\.0\.2-.*win_amd64' | ForEach-Object Line
