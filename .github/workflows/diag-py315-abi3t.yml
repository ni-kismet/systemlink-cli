name: DIAG py315 abi3t (scratch, do not merge)

on:
  push:
    branches: [users/astarche/diag-py315-abi3t]

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: '3.15'

      - name: Image and interpreter info
        shell: pwsh
        run: |
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          python -c "import sys, sysconfig; print(sys.version); print(sys.executable); print(sys.base_prefix); print(sysconfig.get_config_var('abiflags'))"

      - name: Locate python3*.dll and abi3t folders
        shell: pwsh
        run: |
          $root = "${{ env.pythonLocation }}"
          "pythonLocation=$root"
          "--- top-level entries ---"
          Get-ChildItem $root | Select-Object Mode, Name | Format-Table -AutoSize | Out-String -Width 200
          "--- python3*.dll anywhere under install ---"
          Get-ChildItem $root -Recurse -Filter 'python3*.dll' -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          "--- abi3t* directories ---"
          Get-ChildItem $root -Recurse -Directory -Filter '*abi3t*' -ErrorAction SilentlyContinue | Select-Object FullName
          "--- python3t.dll anywhere in toolcache Python ---"
          Get-ChildItem "$env:RUNNER_TOOL_CACHE\Python" -Recurse -Filter 'python3t.dll' -ErrorAction SilentlyContinue | Select-Object FullName
          "--- installer files kept in toolcache dir ---"
          Get-ChildItem $root -File -Filter '*.exe' | Select-Object Name, Length

      - name: Import cryptography 50.0.2 (system interpreter)
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pip install --only-binary=:all: cryptography==50.0.2
          python -m pip show -f cryptography | Select-String 'WHEEL|_rust'
          python -c "import pathlib, cryptography; print(list(pathlib.Path(cryptography.__file__).parent.glob('**/*.dist-info/WHEEL')))"
          Get-Content (python -c "import importlib.metadata as m; d=m.distribution('cryptography'); print(d._path / 'WHEEL')")
          python -c "import cryptography.hazmat.bindings._rust as r; print('IMPORT OK', r.__file__)"

      - name: Import cryptography 50.0.2 (venv)
        shell: pwsh
        continue-on-error: true
        run: |
          python -m venv "$env:RUNNER_TEMP\v"
          & "$env:RUNNER_TEMP\v\Scripts\python.exe" -m pip install -q --only-binary=:all: cryptography==50.0.2
          & "$env:RUNNER_TEMP\v\Scripts\python.exe" -c "import cryptography.hazmat.bindings._rust as r; print('VENV IMPORT OK', r.__file__)"

      - name: Import cryptography 50.0.2 (virtualenv package, as Poetry uses)
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pip install -q virtualenv
          python -m virtualenv --version
          python -m virtualenv "$env:RUNNER_TEMP\ve"
          "--- DLLs in virtualenv ---"
          Get-ChildItem "$env:RUNNER_TEMP\ve" -Recurse -Include 'python3*.dll','python315.dll' | Select-Object FullName
          Get-ChildItem "$env:RUNNER_TEMP\ve" -Recurse -Directory -Filter '*abi3t*' | Select-Object FullName
          & "$env:RUNNER_TEMP\ve\Scripts\python.exe" -m pip install -q --only-binary=:all: cryptography==50.0.2
          & "$env:RUNNER_TEMP\ve\Scripts\python.exe" -c "import cryptography.hazmat.bindings._rust as r; print('VIRTUALENV IMPORT OK', r.__file__)"
          "--- retry after copying abi3t-compat next to the venv's python315.dll ---"
          Copy-Item -Recurse "${{ env.pythonLocation }}\abi3t-compat" "$env:RUNNER_TEMP\ve\Scripts\abi3t-compat"
          & "$env:RUNNER_TEMP\ve\Scripts\python.exe" -c "import cryptography.hazmat.bindings._rust as r; print('VIRTUALENV+COMPAT IMPORT OK', r.__file__)"

      - name: Fresh python.org 3.15.2 installer (same flags as actions/python-versions) for comparison
        shell: pwsh
        continue-on-error: true
        run: |
          $v = python -c "import platform; print(platform.python_version())"
          $exe = "$env:RUNNER_TEMP\python-$v-amd64.exe"
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-amd64.exe" -OutFile $exe
          $dest = "$env:RUNNER_TEMP\pyorg"
          $p = Start-Process $exe -ArgumentList "DefaultAllUsersTargetDir=$dest","InstallAllUsers=1","/quiet","/log","$env:RUNNER_TEMP\pyorg.log" -Wait -PassThru
          "installer exit=$($p.ExitCode)"
          Get-ChildItem $dest -Recurse -Filter 'python3*.dll' | Select-Object FullName
          Select-String -Path "$env:RUNNER_TEMP\pyorg*.log" -Pattern 'abi3t' -List | Select-Object -First 20
          & "$dest\python.exe" -m pip install -q --only-binary=:all: cryptography==50.0.2
          & "$dest\python.exe" -c "import cryptography.hazmat.bindings._rust as r; print('PYORG IMPORT OK', r.__file__)"
