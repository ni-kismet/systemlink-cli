    name: "Product XYZ"
    properties:
      description: "Power electronics product used by the query fixture"
      family: "Power Electronics"
      part_number: "XYZ-2025-001"
      keywords: ["fixture-product"]
    id_reference: "product_xyz"
    tags: ["demo-data-3"]

  - type: "product"
